name: APK Uretici

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Kodlari İndir
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Gerekli Programlari Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --user --upgrade Cython==0.29.33 virtualenv buildozer

    - name: APK Derle
      run: ~/.local/bin/buildozer android debug

    - name: APK'yi Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Bina-Etiket-APK
        path: bin/*.apk
